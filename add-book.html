<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Add Book to Shelf</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Add Book to Shelf 📗</h1>
  </header>

  <div class="container">
    <a href="index.html" class="back-link">Back to Apps</a>

    <div class="form-container">
      <form id="bookForm">
        <div class="form-group">
          <label for="bookSearch">Book</label>
          <input 
            type="text" 
            id="bookSearch" 
            name="bookSearch" 
            required 
            placeholder="Enter book title or author..."
          >
          <p class="info-text">💡 Tip: The book title or author name or both.</p>
        </div>

        <div class="form-group">
          <label for="isbn">ISBN-13</label>
          <input 
            type="text" 
            id="isbn" 
            name="isbn" 
            placeholder="Enter ISBN-13 (optional)"
          >
        </div>

        <div class="form-group">
          <label for="mainShelf">Main Shelf</label>
          <select id="mainShelf" name="mainShelf" required>
            <option value="">Select shelf...</option>
            <option value="Read">Read</option>
            <option value="Want to Read">Want to Read</option>
            <option value="Currently Reading">Currently Reading</option>
            <option value="Favourite">Favourite</option>
          </select>
        </div>

        <div class="form-group">
          <label>Additional Shelves (Click to select multiple)</label>
          <div class="chips-container" id="shelvesChips">
            <div class="chip" onclick="toggleChip(this)">Fiction</div>
            <div class="chip" onclick="toggleChip(this)">Non-Fiction</div>
            <div class="chip" onclick="toggleChip(this)">Mystery</div>
            <div class="chip" onclick="toggleChip(this)">Science Fiction</div>
            <div class="chip" onclick="toggleChip(this)">Biography</div>
          </div>
        </div>

        <div class="form-group">
          <label for="position">Position (Optional)</label>
          <input 
            type="number" 
            id="position" 
            name="position" 
            step="1" 
            placeholder="Physical shelf position"
          >
        </div>

        <button type="submit">Add Book</button>

        <div class="success-message" id="successMessage">
          ✓ Your book has been added to your shelf!
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('bookForm').addEventListener('submit', function(e) {
      const bookSearch = document.getElementById('bookSearch').value;
      const isbn = document.getElementById('isbn').value || 'N/A';
      const mainShelf = document.getElementById('mainShelf').value;
      const position = document.getElementById('position').value || 'N/A';
      const additionalShelves = getSelectedChips('#shelvesChips').join(', ') || 'None';
      
      const formData = {
        subject: `Add Book: ${bookSearch}`,
        body: `Query: ${bookSearch}\n` +
              `ISBN: ${isbn}\n` +
              `Main Shelf: ${mainShelf}\n` +
              `Additional Shelves: ${additionalShelves}\n` +
              `Position: ${position}`
      };
      
      submitForm(e, formData, 'Add Book');
    });
  </script>
</body>
</html>
