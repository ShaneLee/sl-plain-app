<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Health Metrics</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Health Metrics ❤️</h1>
  </header>

  <div class="container">
    <a href="index.html" class="back-link">Back to Apps</a>

    <div class="form-container">
      <form id="healthForm">
        <div class="form-group">
          <label for="heartRate">Heart Rate (bpm)</label>
          <input 
            type="number" 
            id="heartRate" 
            name="heartRate" 
            step="1" 
            required 
            placeholder="0"
          >
        </div>

        <div class="form-group">
          <label for="systolic">Systolic Blood Pressure (mmHg)</label>
          <input 
            type="number" 
            id="systolic" 
            name="systolic" 
            step="1" 
            required 
            placeholder="0"
          >
        </div>

        <div class="form-group">
          <label for="diastolic">Diastolic Blood Pressure (mmHg)</label>
          <input 
            type="number" 
            id="diastolic" 
            name="diastolic" 
            step="1" 
            required 
            placeholder="0"
          >
        </div>

        <div class="form-group">
          <label for="datetime">Measurement Date & Time</label>
          <input 
            type="datetime-local" 
            id="datetime" 
            name="datetime" 
            required
          >
        </div>

        <div class="form-group">
          <label for="comments">Comments (Optional)</label>
          <textarea 
            id="comments" 
            name="comments" 
            placeholder="Add any additional comments..."
          ></textarea>
        </div>

        <button type="submit">Submit</button>

        <div class="success-message" id="successMessage">
          ✓ Your health metrics have been sent to your email!
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('healthForm').addEventListener('submit', function(e) {
      const heartRate = document.getElementById('heartRate').value;
      const systolic = document.getElementById('systolic').value;
      const diastolic = document.getElementById('diastolic').value;
      const datetime = document.getElementById('datetime').value;
      const comments = document.getElementById('comments').value;
      
      const formData = {
        subject: `Health: HR${heartRate}bpm, BP${systolic}/${diastolic}mmHg, ${datetime}`,
        body: comments
      };
      
      submitForm(e, formData, 'Health Metrics');
    });
  </script>
</body>
</html>
