<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todos</title>  <link rel="icon" type="image/png" href="icon.png">  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Todos 📝</h1>
  </header>

  <div class="container">
    <a href="index.html" class="back-link">Back to Apps</a>

    <div class="form-container">
      <form id="taskForm">
        <div class="form-group">
          <label for="task">Create a TODO</label>
          <textarea 
            id="task" 
            name="task" 
            required 
            placeholder="Enter your task (you can include a due date like: Fix bug by 2025-03-15)"
          ></textarea>
          <p class="info-text">💡 Tip: Include dates in format YYYY-MM-DD or describe relative dates (today, tomorrow, next Monday, etc.)</p>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <input 
            type="text" 
            id="category" 
            name="category" 
            placeholder="e.g., Week 1"
          >
        </div>

        <button type="submit">Submit</button>

        <div class="success-message" id="successMessage">
          ✓ Your todo has been sent to your email!
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('taskForm').addEventListener('submit', function(e) {
      const task = document.getElementById('task').value;
      const category = document.getElementById('category').value;
      
      const formData = {
        subject: `TODO: ${task}${category ? ' [' + category + ']' : ''}`
      };
      
      submitForm(e, formData, 'Todos');
    });
  </script>
</body>
</html>
