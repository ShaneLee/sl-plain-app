<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Mood Tracking</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mood Tracking 😊</h1>
  </header>

  <div class="container">
    <a href="index.html" class="back-link">Back to Apps</a>

    <div class="form-container">
      <form id="moodForm">
        <div class="form-group">
          <label for="mood">Mood Rating (1-5)</label>
          <input 
            type="number" 
            id="mood" 
            name="mood" 
            min="1" 
            max="5" 
            required 
            placeholder="Enter mood rating"
          >
          <p class="info-text">Rate your current mood from 1 (worst) to 5 (best)</p>
        </div>

        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea 
            id="notes" 
            name="notes" 
            placeholder="Add any additional notes about your mood..."
          ></textarea>
        </div>

        <button type="submit">Submit</button>

        <div class="success-message" id="successMessage">
          ✓ Your mood tracking data has been sent to your email!
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('moodForm').addEventListener('submit', function(e) {
      const mood = document.getElementById('mood').value;
      const notes = document.getElementById('notes').value;
      
      const formData = {
        subject: `Mood ${mood}`,
        body: notes
      };
      
      submitForm(e, formData, 'Mood Tracking');
    });
  </script>
</body>
</html>
