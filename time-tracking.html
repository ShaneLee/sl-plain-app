<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Time Tracking</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Time Tracking ⏱️</h1>
  </header>

  <div class="container">
    <a href="index.html" class="back-link">Back to Apps</a>

    <div class="form-container">
      <form id="timeForm">
        <div class="form-group">
          <label for="task">Task</label>
          <input 
            type="text" 
            id="task" 
            name="task" 
            required 
            placeholder="What are you working on?"
          >
        </div>

        <div class="form-group">
          <label for="project">Project</label>
          <input 
            type="text" 
            id="project" 
            name="project" 
            placeholder="Project name"
          >
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <input 
            type="text" 
            id="category" 
            name="category" 
            placeholder="Work category"
          >
        </div>

        <button type="submit">Submit Time Entry</button>

        <div class="success-message" id="successMessage">
          ✓ Your time tracking entry has been sent to your email!
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('timeForm').addEventListener('submit', function(e) {
      const task = document.getElementById('task').value;
      const project = document.getElementById('project').value;
      const category = document.getElementById('category').value;
      
      const formData = {
        subject: `Time: ${task}${project ? ' - ' + project : ''}`
      };
      
      submitForm(e, formData, 'Time Tracking');
    });
  </script>
</body>
</html>
