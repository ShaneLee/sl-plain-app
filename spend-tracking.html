<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Spend Tracking</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Spend Tracking 💸</h1>
  </header>

  <div class="container">
    <a href="index.html" class="back-link">Back to Apps</a>

    <div class="form-container">
      <form id="spendForm">
        <div class="form-group">
          <label for="amount">Amount (GBP)</label>
          <input 
            type="number" 
            id="amount" 
            name="amount" 
            step="0.01" 
            required 
            placeholder="0.00"
          >
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <input 
            type="text" 
            id="description" 
            name="description" 
            required 
            placeholder="What did you spend on?"
          >
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select a category...</option>
            <option value="Food">Food</option>
            <option value="Car">Car</option>
            <option value="House">House</option>
            <option value="Music">Music</option>
            <option value="Travel">Travel</option>
            <option value="Clothes">Clothes</option>
            <option value="Other">Other</option>
            <option value="Gifts">Gifts</option>
            <option value="Admin">Admin</option>
          </select>
        </div>

        <div class="form-group">
          <label for="accountAlias">Account</label>
          <select id="accountAlias" name="accountAlias" required>
            <option value="current">Current</option>
            <option value="AMEX">AMEX</option>
            <option value="CASH">Cash</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input 
            type="date" 
            id="date" 
            name="date" 
            required
          >
        </div>

        <div class="form-group">
          <label for="notes">Notes (Optional)</label>
          <textarea 
            id="notes" 
            name="notes" 
            placeholder="Add any additional notes..."
          ></textarea>
        </div>

        <button type="submit">Submit</button>

        <div class="success-message" id="successMessage">
          ✓ Your spend tracking has been sent to your email!
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('spendForm').addEventListener('submit', function(e) {
      const amount = document.getElementById('amount').value;
      const description = document.getElementById('description').value;
      const category = document.getElementById('category').value;
      const accountAlias = document.getElementById('accountAlias').value;
      const date = document.getElementById('date').value;
      const notes = document.getElementById('notes').value;
      
      const formData = {
        subject: `Spend ${amount}, ${description}, ${category}, ${accountAlias}, ${date}`,
        body: notes
      };
      
      submitForm(e, formData, 'Spend Tracking');
    });

    // Set today's date as default
    document.getElementById('date').value = getTodayDate();
  </script>
</body>
</html>
